          restore-keys: |
            vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg/binary-cache
            ${{ github.workspace }}/.devtools/vcpkg/installed
            ${{ github.workspace }}/out/windows/release/vcpkg_installed
          key: vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-

      - name: Setup vcpkg
        shell: pwsh
        run: pwsh -File .github/scripts/setup-vcpkg.ps1

      - name: Configure binary cache
        shell: pwsh
        env:
          VCPKG_NUGET_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || github.token }}
        run: pwsh -File .github/scripts/configure-vcpkg-binary-cache.ps1

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset "Windows Release Config" `
            -DENABLE_TESTS=OFF `
            -DBUILD_TOOLS=OFF `
            -DBUILD_ENGINE_API=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset "Windows Release Build" --parallel ([Environment]::ProcessorCount)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: krkr2-windows
          if-no-files-found: error
          path: out/windows/release/krkr2.exe

      - name: Save vcpkg source downloads
        if: always() && steps.vcpkg_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

