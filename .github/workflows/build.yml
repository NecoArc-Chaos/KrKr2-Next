name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/.devtools/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/binary-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.cache/vcpkg/binary-cache,read"
  VCPKG_BINARY_CACHE_MODE: read

jobs:
  vcpkg-dependencies:
    if: github.event_name != 'pull_request'
    name: vcpkg dependencies (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      VCPKG_BINARY_CACHE_MODE: readwrite
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            triplet: x64-linux
            preset: Linux Release Config
          - platform: windows
            runner: windows-2025
            triplet: x64-windows-static-md
            preset: Windows Release Config
          - platform: android
            runner: ubuntu-24.04
            triplet: arm64-android
          - platform: macos
            runner: macos-14
            triplet: arm64-osx
            preset: MacOS Release Config
          - platform: ios
            runner: macos-14
            triplet: arm64-ios
            preset: iOS Release Config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore vcpkg path (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE '.devtools\vcpkg'
          $env:VCPKG_ROOT = $vcpkgRoot
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_FORCE_DOWNLOADED_BINARIES=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Android
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Linux dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake bison flex libegl1-mesa-dev libfontconfig1-dev \
            libgl1-mesa-dev libgles2-mesa-dev libomp-dev libtool mono-complete \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev \
            nasm ninja-build pkg-config

      - name: Install Linux GTK dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get install -y libgtk-3-dev

      - name: Install Android SDK/NDK
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_NDK_VERSION: 28.0.13004108
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "cmake;3.31.1" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        run: |
          brew list autoconf >/dev/null 2>&1 || brew install autoconf
          brew list automake >/dev/null 2>&1 || brew install automake
          brew list autoconf-archive >/dev/null 2>&1 || brew install autoconf-archive
          brew list bison >/dev/null 2>&1 || brew install bison
          brew list libtool >/dev/null 2>&1 || brew install libtool
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list mono >/dev/null 2>&1 || brew install mono

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # winflexbison3 on Chocolatey ships Bison 3.7.4 (last updated 2021).
          # The .y grammar files require Bison >= 3.8.2, so we download
          # winflexbison v2.5.25 (Bison 3.8.2) directly from GitHub Releases.
          choco install nasm --no-progress --yes
          $wfbZip  = "$env:TEMP\win_flex_bison.zip"
          $wfbDir  = "$env:TEMP\win_flex_bison"
          Invoke-WebRequest `
            -Uri "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip" `
            -OutFile $wfbZip
          Expand-Archive -Path $wfbZip -DestinationPath $wfbDir -Force
          $bison = Get-ChildItem -Path $wfbDir -Filter win_bison.exe -File -Recurse |
            Select-Object -First 1
          if (-not $bison) {
            throw 'win_bison.exe was not found after extracting winflexbison'
          }
          $bison.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $bison.FullName --version

      - name: Restore vcpkg source downloads
        id: vcpkg_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg/binary-cache
            ${{ github.workspace }}/.devtools/vcpkg/installed
            ${{ github.workspace }}/out/${{ matrix.platform }}/release/vcpkg_installed
          key: vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-

      - name: Setup vcpkg (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: bash .github/scripts/setup-vcpkg.sh

      - name: Setup vcpkg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pwsh -File .github/scripts/setup-vcpkg.ps1

      - name: Configure binary cache (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          VCPKG_NUGET_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh

      - name: Configure binary cache (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VCPKG_NUGET_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || github.token }}
        run: pwsh -File .github/scripts/configure-vcpkg-binary-cache.ps1

      - name: Prebuild Android dependencies
        if: matrix.platform == 'android'
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet "${{ matrix.triplet }}" \
            --x-install-root="$VCPKG_ROOT/installed" \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --overlay-ports="$GITHUB_WORKSPACE/vcpkg/ports" \
            --overlay-triplets="$GITHUB_WORKSPACE/vcpkg/triplets"

      - name: Prebuild desktop dependencies (Unix)
        if: matrix.platform == 'linux' || matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        run: |
          cmake --preset "${{ matrix.preset }}" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_ENGINE_API=OFF

      - name: Prebuild desktop dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            & cmake --preset "${{ matrix.preset }}" `
              -DENABLE_TESTS=OFF `
              -DBUILD_TOOLS=OFF `
              -DBUILD_ENGINE_API=OFF
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }
            if ($attempt -eq $maxAttempts) {
              exit $exitCode
            }
            $delay = 15 * [math]::Pow(2, $attempt - 1)
            Write-Host "Dependency prebuild failed with exit code $exitCode; retrying in $delay seconds ($attempt/$maxAttempts)."
            Start-Sleep -Seconds $delay
          }

      - name: Save vcpkg source downloads
        if: always() && steps.vcpkg_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

  analysis:
    needs: vcpkg-dependencies
    if: >-
      always() && (github.event_name == 'pull_request' ||
      needs['vcpkg-dependencies'].result == 'success')
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Live2D SDK
        uses: ./.github/actions/prepare-live2d
        env:
          gthub_token: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || '' }}
        with:
          token: ${{ env.gthub_token }}

      - name: Restore incremental analysis state
        id: analysis_state_cache
        uses: actions/cache/restore@v4
        with:
          path: .analysis-cache
          key: static-analysis-state-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            static-analysis-state-v2-${{ runner.os }}-

      - name: Restore Cppcheck cache
        id: cppcheck_cache
        uses: actions/cache/restore@v4
        with:
          path: out/cppcheck
          key: static-analysis-cppcheck-v2-${{ runner.os }}-${{ hashFiles('.clang-tidy', 'CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**', '.github/workflows/build.yml', '.github/scripts/**') }}-${{ github.sha }}
          restore-keys: |
            static-analysis-cppcheck-v2-${{ runner.os }}-${{ hashFiles('.clang-tidy', 'CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**', '.github/workflows/build.yml', '.github/scripts/**') }}-

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake bison clang clang-tidy clang-tools cppcheck mono-complete \
            flex libegl1-mesa-dev libfontconfig1-dev libgl1-mesa-dev libgtk-3-dev \
            libgles2-mesa-dev libomp-dev libtool libx11-dev libxext-dev \
            libxfixes-dev libxi-dev libxrandr-dev nasm ninja-build pkg-config

      - name: Restore vcpkg source downloads
        id: vcpkg_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg/binary-cache
            ${{ github.workspace }}/.devtools/vcpkg/installed
            ${{ github.workspace }}/out/linux/debug/vcpkg_installed
          key: vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-

      - name: Setup vcpkg
        shell: bash
        run: bash .github/scripts/setup-vcpkg.sh

      - name: Configure binary cache
        shell: bash
        env:
          VCPKG_NUGET_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh

      - name: Generate compilation database
        run: |
          cmake --preset "Linux Debug Config" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_ENGINE_API=OFF

      - name: Select affected analysis files
        id: select_analysis
        shell: bash
        env:
          ANALYSIS_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          ANALYSIS_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p out/cppcheck
          force_full=()
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            force_full=(--force-full)
          fi
          python3 .github/scripts/select-analysis-files.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --compile-commands out/linux/debug/compile_commands.json \
            --cache-dir .analysis-cache \
            --output-dir out/analysis \
            --base-sha "$ANALYSIS_BASE_SHA" \
            --head-sha "$ANALYSIS_HEAD_SHA" \
            "${force_full[@]}"
          mode="$(<out/analysis/mode)"
          file_count="$(wc -l < out/analysis/clang-tidy-files.txt | tr -d ' ')"
          has_files=false
          if [ "$file_count" -gt 0 ]; then
            has_files=true
          fi
          printf 'mode=%s\n' "$mode" > clang-tidy.txt
          printf 'mode=%s\n' "$mode" > cppcheck.txt
          printf 'reason=%s\n' "$(<out/analysis/reason)" >> clang-tidy.txt
          printf 'reason=%s\n' "$(<out/analysis/reason)" >> cppcheck.txt
          {
            echo "mode=$mode"
            echo "has_files=$has_files"
            echo "file_count=$file_count"
          } >> "$GITHUB_OUTPUT"

      - name: Run Clang-Tidy
        id: clang_tidy
        if: steps.select_analysis.outputs.has_files == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          runner="$(command -v run-clang-tidy || true)"
          if [ -z "$runner" ]; then
            runner="$(command -v run-clang-tidy-18 || true)"
          fi
          test -n "$runner"
          mapfile -t files < out/analysis/clang-tidy-files.txt
          "$runner" -p out/linux/debug -j "$(nproc)" -quiet "${files[@]}" 2>&1 | tee -a clang-tidy.txt

      - name: Run Cppcheck
        id: cppcheck
        if: steps.select_analysis.outputs.has_files == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/cppcheck
          cppcheck \
            --project=out/analysis/cppcheck-compile_commands.json \
            --cppcheck-build-dir=out/cppcheck \
            --force \
            --enable=warning,style,performance,portability \
            --inconclusive \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --template=gcc 2>&1 | tee -a cppcheck.txt

      - name: Check PVS-Studio license
        id: pvs-license
        if: steps.select_analysis.outputs.has_files == 'true'
        shell: bash
        env:
          PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
        run: |
          if [ -n "$PVS_STUDIO_CREDENTIALS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PVS-Studio skipped: configure PVS_STUDIO_CREDENTIALS."
          fi

      - name: Compare static-analysis diagnostics
        id: analysis_diagnostics
        if: always()
        shell: bash
        env:
          CLANG_TIDY_OUTCOME: ${{ steps.clang_tidy.outcome }}
          CPPCHECK_OUTCOME: ${{ steps.cppcheck.outcome }}
        run: |
          clang_outcome="${CLANG_TIDY_OUTCOME:-skipped}"
          cppcheck_outcome="${CPPCHECK_OUTCOME:-skipped}"
          python3 .github/scripts/compare-analysis-diagnostics.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --cache-dir .analysis-cache \
            --report clang-tidy clang-tidy.txt \
            --report cppcheck cppcheck.txt \
            --outcome clang-tidy "$clang_outcome" \
            --outcome cppcheck "$cppcheck_outcome" \
            --has-files "${{ steps.select_analysis.outputs.has_files }}" \
            --changed-files out/analysis/changed-files.txt \
            --analyzed-files out/analysis/affected-files.txt \
            --new-diagnostics out/analysis/new-diagnostics.txt

      - name: Install PVS-Studio
        if: steps.pvs-license.outputs.available == 'true'
        shell: bash
        run: |
          curl -fsSL https://files.pvs-studio.com/etc/pubkey.txt \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/pvs-studio.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/pvs-studio.gpg] https://wcdn.pvs-studio.com/deb viva64-release pvs-studio" \
            | sudo tee /etc/apt/sources.list.d/pvs-studio.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y pvs-studio

      - name: Run PVS-Studio
        id: pvs_studio
        if: steps.pvs-license.outputs.available == 'true'
        shell: bash
        env:
          PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
        run: |
          pvs-studio-analyzer credentials "$PVS_STUDIO_CREDENTIALS"
          pvs-studio-analyzer trace -- \
            cmake --build --preset "Linux Debug Build" --parallel "$(nproc)"
          pvs-studio-analyzer analyze -j "$(nproc)" -o pvs-report.plog

      - name: Convert PVS-Studio report
        if: always() && steps.pvs-license.outputs.available == 'true'
        shell: bash
        run: |
          if [ -f pvs-report.plog ]; then
            plog-converter pvs-report.plog -t sarif -n pvs-report -r file://
          fi

      - name: Upload PVS-Studio SARIF
        if: always() && steps.pvs-license.outputs.available == 'true' && hashFiles('pvs-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pvs-report.sarif
          category: pvs-studio

      - name: Enforce analysis gate
        id: enforce_analysis
        if: always()
        shell: bash
        run: |
          failed=false
          if [ "${{ steps.analysis_diagnostics.outcome }}" = failure ]; then
            echo "::error::Static analysis introduced diagnostics or could not run."
            failed=true
          fi
          if [ "${{ steps.pvs_studio.outcome }}" = failure ]; then
            echo "::error::PVS-Studio failed."
            failed=true
          fi
          if [ "$failed" = true ]; then
            exit 1
          fi

      - name: Update successful analysis marker
        if: steps.enforce_analysis.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .analysis-cache
          printf '%s\n' "$GITHUB_SHA" > .analysis-cache/last-successful.sha

      - name: Save incremental analysis cache
        if: always() && steps.analysis_state_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .analysis-cache
          key: static-analysis-state-v2-${{ runner.os }}-${{ github.sha }}

      - name: Save Cppcheck cache
        if: >-
          always() && steps.select_analysis.outputs.has_files == 'true' &&
          steps.cppcheck_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/cppcheck
          key: static-analysis-cppcheck-v2-${{ runner.os }}-${{ hashFiles('.clang-tidy', 'CMakeLists.txt', 'CMakePresets.json', '**/CMakeLists.txt', '**/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**', '.github/workflows/build.yml', '.github/scripts/**') }}-${{ github.sha }}

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          if-no-files-found: warn
          path: |
            clang-tidy.txt
            cppcheck.txt
            out/analysis/affected-files.txt
            out/analysis/changed-files.txt
            out/analysis/new-diagnostics.txt
            pvs-report.plog
            pvs-report.sarif

      - name: Save vcpkg source downloads
        if: always() && steps.vcpkg_source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}

  codeql:
    name: CodeQL C/C++
    needs: [analysis, vcpkg-dependencies]
    if: >-
      always() && needs.analysis.result == 'success' &&
      (github.event_name == 'pull_request' ||
      needs['vcpkg-dependencies'].result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Live2D SDK
        uses: ./.github/actions/prepare-live2d
        env:
          gthub_token: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || '' }}
        with:
          token: ${{ env.gthub_token }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake bison flex libegl1-mesa-dev libfontconfig1-dev libgtk-3-dev mono-complete \
            libgl1-mesa-dev libgles2-mesa-dev libomp-dev libtool libx11-dev \
            libxext-dev libxfixes-dev libxi-dev libxrandr-dev nasm ninja-build \
            pkg-config

      - name: Restore vcpkg source downloads
        id: vcpkg_source_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.devtools/vcpkg/downloads
          key: vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-downloads-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg/binary-cache
            ${{ github.workspace }}/.devtools/vcpkg/installed
            ${{ github.workspace }}/out/linux/release/vcpkg_installed
          key: vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/ports/**', 'vcpkg/triplets/**') }}
          restore-keys: |
            vcpkg-binary-v1-${{ runner.os }}-${{ runner.arch }}-x64-linux-

      - name: Setup vcpkg
        shell: bash
        run: bash .github/scripts/setup-vcpkg.sh

      - name: Configure binary cache
        shell: bash
        env:
          VCPKG_NUGET_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GTHUB_TOKEN || github.token }}
        run: bash .github/scripts/configure-vcpkg-binary-cache.sh

      - name: Build for CodeQL extraction
        shell: bash
        run: |
          cmake --preset "Linux Release Config" \
            -DENABLE_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
